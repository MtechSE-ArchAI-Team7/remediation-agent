name: Image
jobs:
  ci:
    if: ${{ !inputs.validate-only }}
    uses: ./.github/workflows/checks.yaml
    with:
      trusted-scans: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]') }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  image_check:
    if: ${{ inputs.validate-only }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-scan-image.yaml
    with:
      publish: false
  image:
    if: ${{ !inputs.validate-only }}
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-scan-image.yaml
    with:
      publish: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  qualify:
    if: ${{ !inputs.validate-only && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/qualify-agentcore-runtime.yaml
    with:
      image-uri: ${{ needs.image.outputs.image-uri }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      source-revision: ${{ github.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_AGENTCORE_DEPLOY_ROLE_ARN }}
  deploy:
    if: ${{ !inputs.validate-only && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
    - image
    - qualify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-agentcore-runtime.yaml
    with:
      aws-region: ap-southeast-1
      agent-runtime-id: ${{ vars.AGENTCORE_RUNTIME_ID }}
      github-repository: MtechSE-ArchAI-Team7/buggy-ecommerce-demo
      image-uri: ${{ needs.image.outputs.image-uri }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      source-revision: ${{ github.sha }}
      release-id: ${{ github.run_id }}-${{ github.run_attempt }}
      server-protocol: A2A
      smoke-test-json: '{"jsonrpc":"2.0","id":"release-probe","method":"SendMessage","params":{"message":{"messageId":"00000000-0000-4000-8000-000000000001","role":"ROLE_USER","parts":[{"data":{"schema_version":"1.0","probe":"openai"},"mediaType":"application/vnd.aios.provider-probe-request.v1+json"}]}}}'
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_AGENTCORE_DEPLOY_ROLE_ARN }}
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Pipeline summary
      run: |
        required=(ci image)
        if [ "$VALIDATE_ONLY" = "true" ]; then required=(image_check); fi
        if [ "$RELEASE" = "true" ]; then required+=(qualify deploy); fi
        python scripts/ci_reports.py summary "${required[@]}"
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
        VALIDATE_ONLY: ${{ inputs.validate-only }}
        RELEASE: ${{ !inputs.validate-only && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    - name: Record release identity
      run: 'printf ''Source: %s\nImage digest: %s\nRuntime version: %s\n'' "$SOURCE_SHA" "$IMAGE_DIGEST" "$RUNTIME_VERSION"
        >> "$GITHUB_STEP_SUMMARY"'
      env:
        SOURCE_SHA: ${{ github.sha }}
        IMAGE_DIGEST: ${{ needs.image.outputs.image-digest }}
        RUNTIME_VERSION: ${{ needs.deploy.outputs.runtime-version }}
    needs:
    - ci
    - image_check
    - image
    - qualify
    - deploy
    if: ${{ always() }}
'on':
  workflow_dispatch:
    inputs:
      validate-only:
        description: Build and scan only, without publication or runtime changes
        type: boolean
        default: false
  push:
    tags:
    - v*
permissions:
  contents: read
concurrency:
  group: remediation-${{ inputs.validate-only && format('image-validation-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
