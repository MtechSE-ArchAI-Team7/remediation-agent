name: Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    permissions:
      contents: read
      id-token: write
    uses: MtechSE-ArchAI-Team7/github-actions-shared/.github/workflows/docker-build-push-ecr.yaml@1dc6bf5b661676fcc53c3ba085a40acdf49e7a37
    with:
      aws-region: ap-southeast-1
      ecr-repository: aios/remediation-agent
      dockerfile: Dockerfile.agentcore
      platforms: linux/arm64
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
