name: Deploy AgentCore Runtime

on:
  workflow_call:
    inputs:
      aws-region:
        description: AWS region containing the existing AgentCore Runtime and ECR image.
        required: true
        type: string
      agent-runtime-id:
        description: Identifier of the existing AgentCore Runtime to update.
        required: true
        type: string
      github-repository:
        description: Exact owner/repository slug authorized for GitHub inspection and draft pull requests.
        required: true
        type: string
      image-uri:
        description: Tagged ECR image URI produced by the image workflow.
        required: true
        type: string
      image-digest:
        description: Immutable sha256 digest produced by the image workflow.
        required: true
        type: string
      source-revision:
        description: Exact Git commit SHA used to build the image.
        required: true
        type: string
      release-id:
        description: Unique bounded identity for this guarded deployment attempt.
        required: true
        type: string
      smoke-test-json:
        description: Bounded JSON request sent through the DEFAULT endpoint after deployment. Empty disables the probe.
        required: false
        type: string
        default: '{"action":"probe","input":{"probe":"openai"}}'
      server-protocol:
        description: AgentCore server protocol selected atomically with the image (HTTP or A2A).
        required: false
        type: string
        default: HTTP
      readiness-timeout-seconds:
        description: Maximum time to wait for either a deployment or rollback runtime version.
        required: false
        type: number
        default: 900
    secrets:
      AWS_ROLE_ARN:
        description: Least-privilege GitHub OIDC role used to update and invoke the runtime.
        required: true
    outputs:
      deployed-image-uri:
        description: Immutable ECR digest URI selected for deployment.
        value: ${{ jobs.deploy.outputs.deployed-image-uri }}
      runtime-arn:
        description: ARN of the updated AgentCore Runtime.
        value: ${{ jobs.deploy.outputs.runtime-arn }}
      runtime-version:
        description: AgentCore Runtime version selected by this deployment.
        value: ${{ jobs.deploy.outputs.runtime-version }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: agentcore-${{ github.repository }}-${{ inputs.agent-runtime-id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      deployed-image-uri: ${{ steps.release.outputs.target-image }}
      runtime-arn: ${{ steps.release.outputs.runtime-arn }}
      runtime-version: ${{ steps.release.outputs.runtime-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked release evidence verifier
        run: uv sync --frozen --no-dev
      - name: Read this workflow's immutable-image qualification evidence
        uses: actions/download-artifact@v4
        with:
          pattern: workflow-qualification-*
          path: ${{ runner.temp }}/workflow-qualification
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Validate release and inspect runtime
        id: prepare
        shell: bash
        env:
          AGENT_RUNTIME_ID: ${{ inputs.agent-runtime-id }}
          EXPECTED_AWS_ACCOUNT_ID: "734849394833"
          AWS_REGION: ${{ inputs.aws-region }}
          TARGET_GITHUB_REPOSITORY: ${{ inputs.github-repository }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          IMAGE_URI: ${{ inputs.image-uri }}
          SOURCE_REVISION: ${{ inputs.source-revision }}
          RELEASE_ID: ${{ inputs.release-id }}
          READINESS_TIMEOUT_SECONDS: ${{ inputs.readiness-timeout-seconds }}
          SERVER_PROTOCOL: ${{ inputs.server-protocol }}
          SMOKE_TEST_JSON: ${{ inputs.smoke-test-json }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "The expected AWS account ID must contain exactly 12 digits." >&2
            exit 1
          fi
          if [[ ! "$AGENT_RUNTIME_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]{0,99}-[a-zA-Z0-9]{10}$ ]]; then
            echo "The AgentCore Runtime identifier is invalid." >&2
            exit 1
          fi
          if [[ ! "$TARGET_GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
             (( ${#TARGET_GITHUB_REPOSITORY} > 200 )); then
            echo "The GitHub repository must use a bounded owner/repository slug." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The image digest must be an immutable sha256 digest." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The source revision must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_ID" =~ ^[A-Za-z0-9._-]{1,191}$ ]]; then
            echo "The release ID must be a bounded identifier." >&2
            exit 1
          fi
          if [[ ! "$READINESS_TIMEOUT_SECONDS" =~ ^[0-9]+$ ]] ||
             (( READINESS_TIMEOUT_SECONDS < 60 || READINESS_TIMEOUT_SECONDS > 1800 )); then
            echo "The readiness timeout must be between 60 and 1800 seconds." >&2
            exit 1
          fi
          if (( ${#SMOKE_TEST_JSON} > 4096 )); then
            echo "The smoke-test request exceeds 4096 characters." >&2
            exit 1
          fi
          if [[ "$SERVER_PROTOCOL" != "HTTP" && "$SERVER_PROTOCOL" != "A2A" ]]; then
            echo "The server protocol must be HTTP or A2A." >&2
            exit 1
          fi
          if [[ -n "$SMOKE_TEST_JSON" ]] && ! jq -e 'type == "object"' <<<"$SMOKE_TEST_JSON" >/dev/null; then
            echo "The smoke-test request must be a JSON object." >&2
            exit 1
          fi
          if ! aws bedrock-agentcore-control update-agent-runtime --generate-cli-skeleton input |
             jq -e 'has("filesystemConfigurations")' >/dev/null; then
            echo "The AWS CLI is too old to preserve AgentCore filesystem configurations." >&2
            exit 1
          fi

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "Refusing AgentCore deployment in unexpected AWS account ${account_id}." >&2
            exit 1
          fi
          expected_prefix="${EXPECTED_AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/"
          if [[ "$IMAGE_URI" != "${expected_prefix}"*:* ]] || [[ "$IMAGE_URI" == *@* ]]; then
            echo "The image URI must be a tagged ECR image in the deployment account and region." >&2
            exit 1
          fi
          image_repository="${IMAGE_URI%:*}"
          target_image="${image_repository}@${IMAGE_DIGEST}"

          current_file="${RUNNER_TEMP}/agentcore-current.json"
          aws bedrock-agentcore-control get-agent-runtime \
            --agent-runtime-id "$AGENT_RUNTIME_ID" \
            --region "$AWS_REGION" \
            --output json >"$current_file"

          current_status="$(jq -r '.status // empty' "$current_file")"
          if [[ "$current_status" != "READY" ]]; then
            echo "The existing AgentCore Runtime is not READY." >&2
            exit 1
          fi

          runtime_role_arn="$(jq -r '.roleArn // empty' "$current_file")"
          runtime_arn="$(jq -r '.agentRuntimeArn // empty' "$current_file")"
          runtime_version="$(jq -r '.agentRuntimeVersion // empty' "$current_file")"
          current_image="$(jq -r '.agentRuntimeArtifact.containerConfiguration.containerUri // empty' "$current_file")"
          current_protocol="$(jq -r '.protocolConfiguration.serverProtocol // "HTTP"' "$current_file")"
          current_repository="$(jq -r '.environmentVariables.AIOS_GITHUB_REPOSITORY // empty' "$current_file")"
          current_release_id="$(jq -r '.environmentVariables.AIOS_RELEASE_ID // empty' "$current_file")"
          current_source_revision="$(jq -r '.environmentVariables.AIOS_RELEASE_SOURCE_SHA // empty' "$current_file")"
          current_image_digest="$(jq -r '.environmentVariables.AIOS_RELEASE_IMAGE_DIGEST // empty' "$current_file")"
          current_runtime_id="$(jq -r '.environmentVariables.AIOS_AGENTCORE_RUNTIME_ID // empty' "$current_file")"
          previous_image_digest="${current_image##*@}"
          if [[ -z "$runtime_role_arn" || -z "$runtime_arn" || -z "$runtime_version" || -z "$current_image" ||
                ( "$current_protocol" != "HTTP" && "$current_protocol" != "A2A" ) ]]; then
            echo "The existing runtime is not a complete container-based AgentCore Runtime." >&2
            exit 1
          fi
          if [[ ! "$previous_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [[ "$current_image" != "${expected_prefix}"*@"$previous_image_digest" ]] ||
             [[ -n "$current_image_digest" && "$current_image_digest" != "$previous_image_digest" ]]; then
            echo "The existing runtime image is not an immutable ECR digest in the deployment account and Region." >&2
            exit 1
          fi
          if ! jq -e '
            (.environmentVariables | type == "object") and
            (.environmentVariables.AIOS_WORKSPACE_ROOT == "/mnt/workspace/runs") and
            (.lifecycleConfiguration | type == "object") and
            (.metadataConfiguration.requireMMDSV2 == true) and
            (.networkConfiguration | type == "object") and
            (
              .filesystemConfigurations == null or
              .filesystemConfigurations == [{"sessionStorage":{"mountPath":"/mnt/workspace"}}]
            )
          ' "$current_file" >/dev/null; then
            echo "The existing runtime is missing required preserved configuration." >&2
            exit 1
          fi
          filesystem_ready="$(jq -r '
            .filesystemConfigurations == [{"sessionStorage":{"mountPath":"/mnt/workspace"}}]
          ' "$current_file")"

          {
            echo "AGENTCORE_CURRENT_CONFIGURATION_FILE=$current_file"
            echo "AGENTCORE_EXECUTION_ROLE_ARN=$runtime_role_arn"
            echo "AGENTCORE_RUNTIME_ARN=$runtime_arn"
            echo "AGENTCORE_TARGET_IMAGE=$target_image"
            echo "AGENTCORE_TARGET_GITHUB_REPOSITORY=$TARGET_GITHUB_REPOSITORY"
            echo "AGENTCORE_PREVIOUS_IMAGE=$current_image"
            echo "AGENTCORE_PREVIOUS_IMAGE_DIGEST=$previous_image_digest"
            echo "AGENTCORE_PREVIOUS_SOURCE_REVISION=$current_source_revision"
            echo "AGENTCORE_PREVIOUS_VERSION=$runtime_version"
            echo "AGENTCORE_PREVIOUS_PROTOCOL=$current_protocol"
            echo "AGENTCORE_TARGET_PROTOCOL=$SERVER_PROTOCOL"
            echo "AGENTCORE_RELEASE_ID=$RELEASE_ID"
            echo "AGENTCORE_SOURCE_REVISION=$SOURCE_REVISION"
            echo "AGENTCORE_IMAGE_DIGEST=$IMAGE_DIGEST"
            echo "AGENTCORE_READINESS_TIMEOUT_SECONDS=$READINESS_TIMEOUT_SECONDS"
          } >>"$GITHUB_ENV"
          {
            echo "current-version=$runtime_version"
            echo "runtime-arn=$runtime_arn"
            echo "target-image=$target_image"
          } >>"$GITHUB_OUTPUT"
          uv run python -m scripts.check_release_qualification \
            --evidence "$RUNNER_TEMP/workflow-qualification" \
            --runtime "$current_file" \
            --source "$SOURCE_REVISION" --image "$IMAGE_DIGEST"
          tagged_digest="$(aws ecr describe-images --repository-name aios/remediation-agent \
            --image-ids "imageTag=$SOURCE_REVISION" --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' --output text)"
          if [[ "$tagged_digest" != "$IMAGE_DIGEST" ]]; then
            echo "The pushed source tag does not identify the qualified immutable image." >&2
            exit 1
          fi
          if [[ "$current_image" == "$target_image" && "$current_protocol" == "$SERVER_PROTOCOL" &&
                "$current_repository" == "$TARGET_GITHUB_REPOSITORY" && "$filesystem_ready" == "true" &&
                "$current_release_id" == "$RELEASE_ID" && "$current_source_revision" == "$SOURCE_REVISION" &&
                "$current_image_digest" == "$IMAGE_DIGEST" && "$current_runtime_id" == "$AGENT_RUNTIME_ID" ]]; then
            echo "already-current=true" >>"$GITHUB_OUTPUT"
          else
            echo "already-current=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Update AgentCore Runtime
        id: update
        if: ${{ steps.prepare.outputs.already-current != 'true' }}
        shell: bash
        env:
          AGENT_RUNTIME_ID: ${{ inputs.agent-runtime-id }}
          AWS_REGION: ${{ inputs.aws-region }}
          TARGET_GITHUB_REPOSITORY: ${{ inputs.github-repository }}
        run: |
          set -euo pipefail

          request_file="${RUNNER_TEMP}/agentcore-update-request.json"
          response_file="${RUNNER_TEMP}/agentcore-update-response.json"
          client_token="deploy-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --slurpfile current "$AGENTCORE_CURRENT_CONFIGURATION_FILE" \
            --arg runtime_id "$AGENT_RUNTIME_ID" \
            --arg image "$AGENTCORE_TARGET_IMAGE" \
            --arg role "$AGENTCORE_EXECUTION_ROLE_ARN" \
            --arg protocol "$AGENTCORE_TARGET_PROTOCOL" \
            --arg repository "$TARGET_GITHUB_REPOSITORY" \
            --arg release_id "$AGENTCORE_RELEASE_ID" \
            --arg source_revision "$AGENTCORE_SOURCE_REVISION" \
            --arg image_digest "$AGENTCORE_IMAGE_DIGEST" \
            --arg token "$client_token" \
            '($current[0] | {
              environmentVariables: (.environmentVariables + {
                AIOS_GITHUB_REPOSITORY: $repository,
                AIOS_RELEASE_ID: $release_id,
                AIOS_RELEASE_SOURCE_SHA: $source_revision,
                AIOS_RELEASE_IMAGE_DIGEST: $image_digest,
                AIOS_AGENTCORE_RUNTIME_ID: $runtime_id
              }),
              lifecycleConfiguration,
              metadataConfiguration,
              networkConfiguration
            }) + {
              agentRuntimeId: $runtime_id,
              agentRuntimeArtifact: {containerConfiguration: {containerUri: $image}},
              filesystemConfigurations: [{sessionStorage: {mountPath: "/mnt/workspace"}}],
              protocolConfiguration: {serverProtocol: $protocol},
              roleArn: $role,
              clientToken: $token
            }' >"$request_file"
          aws bedrock-agentcore-control update-agent-runtime \
            --cli-input-json "file://${request_file}" \
            --region "$AWS_REGION" \
            --output json >"$response_file"

          runtime_version="$(jq -r '.agentRuntimeVersion // empty' "$response_file")"
          runtime_arn="$(jq -r '.agentRuntimeArn // empty' "$response_file")"
          if [[ -z "$runtime_version" || -z "$runtime_arn" ]]; then
            echo "AgentCore did not return the new runtime identity." >&2
            exit 1
          fi
          {
            echo "runtime-version=$runtime_version"
            echo "runtime-arn=$runtime_arn"
          } >>"$GITHUB_OUTPUT"

      - name: Select deployed release
        id: release
        shell: bash
        env:
          ALREADY_CURRENT: ${{ steps.prepare.outputs.already-current }}
          CURRENT_RUNTIME_ARN: ${{ steps.prepare.outputs.runtime-arn }}
          CURRENT_RUNTIME_VERSION: ${{ steps.prepare.outputs.current-version }}
          NEW_RUNTIME_ARN: ${{ steps.update.outputs.runtime-arn }}
          NEW_RUNTIME_VERSION: ${{ steps.update.outputs.runtime-version }}
          TARGET_IMAGE: ${{ steps.prepare.outputs.target-image }}
        run: |
          set -euo pipefail
          if [[ "$ALREADY_CURRENT" == "true" ]]; then
            changed=false
            runtime_arn="$CURRENT_RUNTIME_ARN"
            runtime_version="$CURRENT_RUNTIME_VERSION"
          else
            changed=true
            runtime_arn="$NEW_RUNTIME_ARN"
            runtime_version="$NEW_RUNTIME_VERSION"
          fi
          if [[ -z "$runtime_arn" || -z "$runtime_version" ]]; then
            echo "The selected AgentCore release is incomplete." >&2
            exit 1
          fi
          {
            echo "changed=$changed"
            echo "runtime-arn=$runtime_arn"
            echo "runtime-version=$runtime_version"
            echo "target-image=$TARGET_IMAGE"
          } >>"$GITHUB_OUTPUT"

      - name: Wait for deployed runtime version
        if: ${{ steps.release.outputs.changed == 'true' }}
        shell: bash
        env:
          AGENT_RUNTIME_ID: ${{ inputs.agent-runtime-id }}
          AWS_REGION: ${{ inputs.aws-region }}
          RUNTIME_VERSION: ${{ steps.release.outputs.runtime-version }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + AGENTCORE_READINESS_TIMEOUT_SECONDS))
          while (( SECONDS < deadline )); do
            status="$(aws bedrock-agentcore-control get-agent-runtime \
              --agent-runtime-id "$AGENT_RUNTIME_ID" \
              --agent-runtime-version "$RUNTIME_VERSION" \
              --region "$AWS_REGION" \
              --query status \
              --output text)"
            case "$status" in
              READY)
                exit 0
                ;;
              CREATE_FAILED|UPDATE_FAILED|DELETING)
                echo "The new AgentCore Runtime version did not become ready." >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the new AgentCore Runtime version." >&2
          exit 1

      - name: Verify deployed runtime invariants
        if: ${{ steps.release.outputs.changed == 'true' }}
        shell: bash
        env:
          AGENT_RUNTIME_ID: ${{ inputs.agent-runtime-id }}
          EXPECTED_AWS_ACCOUNT_ID: "734849394833"
          AWS_REGION: ${{ inputs.aws-region }}
          RUNTIME_ARN: ${{ steps.release.outputs.runtime-arn }}
          RUNTIME_VERSION: ${{ steps.release.outputs.runtime-version }}
          RELEASE_ID: ${{ inputs.release-id }}
          SOURCE_REVISION: ${{ inputs.source-revision }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          set -euo pipefail

          verification_file="${RUNNER_TEMP}/agentcore-deployed-verification.json"
          aws bedrock-agentcore-control get-agent-runtime \
            --agent-runtime-id "$AGENT_RUNTIME_ID" \
            --agent-runtime-version "$RUNTIME_VERSION" \
            --region "$AWS_REGION" \
            --output json >"$verification_file"
          if ! jq -e \
            --arg arn "$RUNTIME_ARN" \
            --arg version "$RUNTIME_VERSION" \
            --arg account "$EXPECTED_AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg release_id "$RELEASE_ID" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg runtime_id "$AGENT_RUNTIME_ID" '
              .agentRuntimeArn == $arn and
              .agentRuntimeVersion == $version and
              .status == "READY" and
              (.roleArn | startswith("arn:aws:iam::" + $account + ":role/")) and
              (.agentRuntimeArtifact.containerConfiguration.containerUri |
                startswith($account + ".dkr.ecr." + $region + ".amazonaws.com/")) and
              .filesystemConfigurations == [{"sessionStorage":{"mountPath":"/mnt/workspace"}}] and
              .environmentVariables.AIOS_WORKSPACE_ROOT == "/mnt/workspace/runs" and
              .environmentVariables.AIOS_RELEASE_ID == $release_id and
              .environmentVariables.AIOS_RELEASE_SOURCE_SHA == $source_revision and
              .environmentVariables.AIOS_RELEASE_IMAGE_DIGEST == $image_digest and
              .environmentVariables.AIOS_AGENTCORE_RUNTIME_ID == $runtime_id and
              (.agentRuntimeArtifact.containerConfiguration.containerUri | endswith("@" + $image_digest))
            ' "$verification_file" >/dev/null; then
            echo "The deployed AgentCore Runtime failed the account or workspace invariant check." >&2
            exit 1
          fi

      - name: Run bounded runtime probe
        if: ${{ inputs.smoke-test-json != '' }}
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws-region }}
          RUNTIME_ARN: ${{ steps.release.outputs.runtime-arn }}
          SMOKE_TEST_JSON: ${{ inputs.smoke-test-json }}
          SERVER_PROTOCOL: ${{ inputs.server-protocol }}
        run: |
          set -euo pipefail
          payload_file="${RUNNER_TEMP}/agentcore-smoke-request.json"
          response_file="${RUNNER_TEMP}/agentcore-smoke-response.json"
          log_file="${RUNNER_TEMP}/agentcore-smoke-cli.log"
          printf '%s' "$SMOKE_TEST_JSON" >"$payload_file"

          for attempt in 1 2 3; do
            session_id="$(cat /proc/sys/kernel/random/uuid)"
            if aws bedrock-agentcore invoke-agent-runtime \
              --agent-runtime-arn "$RUNTIME_ARN" \
              --qualifier DEFAULT \
              --runtime-session-id "$session_id" \
              --content-type application/json \
              --accept application/json \
              --payload "fileb://${payload_file}" \
              --region "$AWS_REGION" \
              "$response_file" >"$log_file" 2>&1; then
              if [[ "$SERVER_PROTOCOL" == "A2A" ]] &&
                 jq -e '
                   .jsonrpc == "2.0" and
                   (.result.message.parts | any(
                     .mediaType == "application/vnd.aios.provider-probe-result.v1+json" and
                     .data.schema_version == "1.0" and
                     .data.status == "ok"
                   ))
                 ' "$response_file" >/dev/null 2>&1; then
                exit 0
              fi
              if [[ "$SERVER_PROTOCOL" == "HTTP" ]] &&
                 jq -e '.output.status == "ok"' "$response_file" >/dev/null 2>&1; then
                exit 0
              fi
            fi
            if (( attempt < 3 )); then
              sleep 10
            fi
          done
          echo "The bounded AgentCore Runtime probe failed after three attempts." >&2
          exit 1

      - name: Restore previous runtime image
        id: rollback
        if: ${{ failure() && steps.release.outputs.changed == 'true' }}
        shell: bash
        env:
          AGENT_RUNTIME_ID: ${{ inputs.agent-runtime-id }}
          AWS_REGION: ${{ inputs.aws-region }}
          EXPECTED_AWS_ACCOUNT_ID: "734849394833"
          RELEASE_ID: ${{ inputs.release-id }}
          RUNTIME_ARN: ${{ steps.prepare.outputs.runtime-arn }}
          SMOKE_TEST_JSON: ${{ inputs.smoke-test-json }}
        run: |
          set -euo pipefail

          request_file="${RUNNER_TEMP}/agentcore-rollback-request.json"
          response_file="${RUNNER_TEMP}/agentcore-rollback-response.json"
          client_token="rollback-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rollback_release_id="rollback-${RELEASE_ID}"
          jq -n \
            --slurpfile current "$AGENTCORE_CURRENT_CONFIGURATION_FILE" \
            --arg runtime_id "$AGENT_RUNTIME_ID" \
            --arg image "$AGENTCORE_PREVIOUS_IMAGE" \
            --arg role "$AGENTCORE_EXECUTION_ROLE_ARN" \
            --arg protocol "$AGENTCORE_PREVIOUS_PROTOCOL" \
            --arg release_id "$rollback_release_id" \
            --arg image_digest "$AGENTCORE_PREVIOUS_IMAGE_DIGEST" \
            --arg token "$client_token" \
            '($current[0] | {
              environmentVariables: (.environmentVariables + {
                AIOS_RELEASE_ID: $release_id,
                AIOS_RELEASE_IMAGE_DIGEST: $image_digest,
                AIOS_AGENTCORE_RUNTIME_ID: $runtime_id
              }),
              lifecycleConfiguration,
              metadataConfiguration,
              networkConfiguration
            }) + {
              agentRuntimeId: $runtime_id,
              agentRuntimeArtifact: {containerConfiguration: {containerUri: $image}},
              filesystemConfigurations: [{sessionStorage: {mountPath: "/mnt/workspace"}}],
              protocolConfiguration: {serverProtocol: $protocol},
              roleArn: $role,
              clientToken: $token
            }' >"$request_file"
          aws bedrock-agentcore-control update-agent-runtime \
            --cli-input-json "file://${request_file}" \
            --region "$AWS_REGION" \
            --output json >"$response_file"
          rollback_version="$(jq -r '.agentRuntimeVersion // empty' "$response_file")"
          if [[ -z "$rollback_version" ]]; then
            echo "AgentCore did not return a rollback runtime version." >&2
            exit 1
          fi

          deadline=$((SECONDS + AGENTCORE_READINESS_TIMEOUT_SECONDS))
          while (( SECONDS < deadline )); do
            status="$(aws bedrock-agentcore-control get-agent-runtime \
              --agent-runtime-id "$AGENT_RUNTIME_ID" \
              --agent-runtime-version "$rollback_version" \
              --region "$AWS_REGION" \
              --query status \
              --output text)"
            case "$status" in
              READY)
                verification_file="${RUNNER_TEMP}/agentcore-rollback-verification.json"
                aws bedrock-agentcore-control get-agent-runtime \
                  --agent-runtime-id "$AGENT_RUNTIME_ID" \
                  --agent-runtime-version "$rollback_version" \
                  --region "$AWS_REGION" \
                  --output json >"$verification_file"
                if ! jq -e \
                  --arg arn "$RUNTIME_ARN" \
                  --arg version "$rollback_version" \
                  --arg account "$EXPECTED_AWS_ACCOUNT_ID" \
                  --arg region "$AWS_REGION" \
                  --arg release_id "$rollback_release_id" \
                  --arg image "$AGENTCORE_PREVIOUS_IMAGE" \
                  --arg image_digest "$AGENTCORE_PREVIOUS_IMAGE_DIGEST" \
                  --arg runtime_id "$AGENT_RUNTIME_ID" \
                  --arg source_revision "$AGENTCORE_PREVIOUS_SOURCE_REVISION" '
                  .status == "READY" and
                  .agentRuntimeArn == $arn and
                  .agentRuntimeVersion == $version and
                  (.roleArn | startswith("arn:aws:iam::" + $account + ":role/")) and
                  .agentRuntimeArtifact.containerConfiguration.containerUri == $image and
                  (.agentRuntimeArtifact.containerConfiguration.containerUri |
                    startswith($account + ".dkr.ecr." + $region + ".amazonaws.com/")) and
                  .filesystemConfigurations == [{"sessionStorage":{"mountPath":"/mnt/workspace"}}] and
                  .environmentVariables.AIOS_WORKSPACE_ROOT == "/mnt/workspace/runs" and
                  .environmentVariables.AIOS_RELEASE_ID == $release_id and
                  .environmentVariables.AIOS_RELEASE_IMAGE_DIGEST == $image_digest and
                  .environmentVariables.AIOS_AGENTCORE_RUNTIME_ID == $runtime_id and
                  ($source_revision == "" or .environmentVariables.AIOS_RELEASE_SOURCE_SHA == $source_revision)
                ' "$verification_file" >/dev/null; then
                  echo "The AgentCore rollback version failed its release or workspace invariant check." >&2
                  exit 1
                fi
                if [[ -n "$SMOKE_TEST_JSON" ]]; then
                  payload_file="${RUNNER_TEMP}/agentcore-rollback-smoke-request.json"
                  response_body="${RUNNER_TEMP}/agentcore-rollback-smoke-response.json"
                  log_file="${RUNNER_TEMP}/agentcore-rollback-smoke-cli.log"
                  printf '%s' "$SMOKE_TEST_JSON" >"$payload_file"
                  probe_ok=false
                  for attempt in 1 2 3; do
                    session_id="$(cat /proc/sys/kernel/random/uuid)"
                    if aws bedrock-agentcore invoke-agent-runtime \
                      --agent-runtime-arn "$RUNTIME_ARN" \
                      --qualifier DEFAULT \
                      --runtime-session-id "$session_id" \
                      --content-type application/json \
                      --accept application/json \
                      --payload "fileb://${payload_file}" \
                      --region "$AWS_REGION" \
                      "$response_body" >"$log_file" 2>&1; then
                      if [[ "$AGENTCORE_PREVIOUS_PROTOCOL" == "A2A" ]] &&
                         jq -e '
                           .jsonrpc == "2.0" and
                           (.result.message.parts | any(
                             .mediaType == "application/vnd.aios.provider-probe-result.v1+json" and
                             .data.schema_version == "1.0" and
                             .data.status == "ok"
                           ))
                         ' "$response_body" >/dev/null 2>&1; then
                        probe_ok=true
                        break
                      fi
                      if [[ "$AGENTCORE_PREVIOUS_PROTOCOL" == "HTTP" ]] &&
                         jq -e '.output.status == "ok"' "$response_body" >/dev/null 2>&1; then
                        probe_ok=true
                        break
                      fi
                    fi
                    if (( attempt < 3 )); then
                      sleep 10
                    fi
                  done
                  if [[ "$probe_ok" != "true" ]]; then
                    echo "The bounded rollback provider probe failed after three attempts." >&2
                    exit 1
                  fi
                fi
                echo "runtime-version=$rollback_version" >>"$GITHUB_OUTPUT"
                exit 0
                ;;
              CREATE_FAILED|UPDATE_FAILED|DELETING)
                echo "The AgentCore rollback version did not become ready." >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the AgentCore rollback version." >&2
          exit 1

      - name: Summarize deployment
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          SOURCE_REVISION: ${{ inputs.source-revision }}
          RELEASE_ID: ${{ inputs.release-id }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          ROLLBACK_VERSION: ${{ steps.rollback.outputs.runtime-version }}
          RUNTIME_VERSION: ${{ steps.release.outputs.runtime-version }}
        run: |
          {
            echo "## AgentCore deployment"
            echo
            echo "- Image digest: \`$IMAGE_DIGEST\`"
            echo "- Source revision: \`$SOURCE_REVISION\`"
            echo "- Release ID: \`$RELEASE_ID\`"
            echo "- Runtime version: \`${RUNTIME_VERSION:-unavailable}\`"
            echo "- Deployment status: \`$DEPLOYMENT_STATUS\`"
            echo "- Rollback outcome: \`${ROLLBACK_OUTCOME:-not-run}\`"
            if [[ -n "$ROLLBACK_VERSION" ]]; then
              echo "- Rollback version: \`$ROLLBACK_VERSION\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
