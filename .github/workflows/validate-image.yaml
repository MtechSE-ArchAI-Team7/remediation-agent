name: Validate image without publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    uses: ./.github/workflows/build-scan-image.yaml
    permissions:
      contents: read
      id-token: write
    with:
      publish: false
