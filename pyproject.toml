[project]
name = "aios-remediation-agent"
version = "0.1.0"
description = "Bounded Resolution/Remediation Agent for AIOS."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43.62,<2.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "langchain-aws>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-deepseek>=0.1.0",
  "langchain-mcp-adapters>=0.3.1,<0.4.0",
  "langchain-openai>=0.3.9",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-aws==1.2.3",
  "langgraph-checkpoint-postgres>=3.0.0",
  "mcp>=1.28,<2.0.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.10.0",
  "pycryptodome>=3.23.0",
  "unidiff>=0.7.5",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "bandit>=1.8.0",
  "hatchling>=1.28.0",
  "httpx>=0.28.0",
  "mypy>=1.16.0",
  "pip>=26.2",
  "pip-audit>=2.9.0",
  "pyyaml>=6.0.3",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[project.scripts]
remediation-agent = "remediation_agent.main:main"
remediation-db-init = "remediation_agent.db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remediation_agent"]
artifacts = ["src/remediation_agent/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires Docker or PostgreSQL and is excluded from the default suite",
  "live_model: calls a configured external LLM provider and is excluded by default",
  "mcp: exercises the hosted GitHub MCP transport and inspection tool boundary",
  "live_mcp: calls GitHub's hosted MCP endpoint and is excluded by default",
]
addopts = "-m 'not integration and not live_model and not live_mcp'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "S"]
ignore = [
  "S101",
  "S104",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["remediation_agent"]

[tool.coverage.run]
source = ["remediation_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
