[project]
name = "agent-template"
version = "0.1.0"
description = "Minimal Python agent service template for ArchAI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "bandit>=1.8.0",
  "hatchling>=1.28.0",
  "httpx>=0.28.0",
  "mypy>=1.16.0",
  "pip-audit>=2.9.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[project.scripts]
agent-template = "agent_template.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_template"]
artifacts = ["src/agent_template/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "S"]
ignore = [
  "S101",
  "S104",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_template"]

[tool.coverage.run]
source = ["agent_template"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
